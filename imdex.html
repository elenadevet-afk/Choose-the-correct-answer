<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Варим зелье! - Сортер</title>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto', sans-serif;
            background: radial-gradient(circle at center, #2e2142, #181124);
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .game-container {
            width: 100%;
            max-width: 800px;
            height: 500px;
            background: rgba(30, 24, 41, 0.85);
            border: 2px solid #5a457a;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-family: 'Russo One', sans-serif;
            font-size: 1.8rem;
            color: #d1b3ff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .score {
            font-size: 1.1rem;
            background: #412f5c;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #7c5295;
        }
        .play-area {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex: 1;
            margin: 20px 0;
        }
        .zone {
            width: 220px;
            height: 180px;
            background: rgba(255,255,255,0.04);
            border: 3px dashed #7c5295;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .zone.drag-over {
            background: rgba(124, 82, 149, 0.25);
            border-color: #bfaee0;
            transform: scale(1.03);
        }
        .zone h3 {
            font-family: 'Russo One', sans-serif;
            font-size: 1rem;
            margin-bottom: 10px;
            color: #e2d9ed;
            text-align: center;
        }
        .items-pool {
            display: flex;
            justify-content: center;
            gap: 20px;
            min-height: 70px;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 10px;
        }
        .draggable-item {
            width: 60px;
            height: 60px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 2px solid #bfaee0;
            transition: transform 0.2s;
            user-select: none;
        }
        .draggable-item:active { cursor: grabbing; }
        .draggable-item:hover { transform: scale(1.1); }
        .draggable-item img {
            width: 75%;
            height: 75%;
            object-fit: contain;
            pointer-events: none;
        }
        #win-screen {
            position: absolute;
            inset: 0;
            background: rgba(24, 17, 36, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            z-index: 10;
        }
        #win-screen h2 {
            font-family: 'Russo One', sans-serif;
            font-size: 2.5rem;
            color: #76ff76;
            margin-bottom: 15px;
        }
        .btn {
            background: #7c5295;
            color: #fff;
            border: none;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-family: 'Russo One', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #9363b0; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <h1>Варим зелье!</h1>
            <div class="score">Собрано: <span id="score">0</span> / 4</div>
        </div>

        <div class="play-area">
            <!-- Зона 1 -->
            <div class="zone" id="zone-1" data-category="alchemy" ondragover="allowDrop(event)" ondragleave="removeHighlight(event)" ondrop="dropItem(event)">
                <h3>🪄 Котел стихий</h3>
            </div>
            <!-- Зона 2 -->
            <div class="zone" id="zone-2" data-category="nature" ondragover="allowDrop(event)" ondragleave="removeHighlight(event)" ondrop="dropItem(event)">
                <h3>🍄 Лесная поляна</h3>
            </div>
        </div>

        <div class="items-pool" id="pool">
            <!-- Элементы с указанием правильной категории (cat) -->
            <div class="draggable-item" draggable="true" id="item-1" data-category="alchemy" ondragstart="drag(event)">
                <img src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" alt="Кристалл">
            </div>
            <div class="draggable-item" draggable="true" id="item-2" data-category="nature" ondragstart="drag(event)">
                <img src="https://cdn-icons-png.flaticon.com/512/2917/2917995.png" alt="Гриб">
            </div>
            <div class="draggable-item" draggable="true" id="item-3" data-category="alchemy" ondragstart="drag(event)">
                <img src="https://cdn-icons-png.flaticon.com/512/2933/2933116.png" alt="Зелье">
            </div>
            <div class="draggable-item" draggable="true" id="item-4" data-category="nature" ondragstart="drag(event)">
                <img src="https://cdn-icons-png.flaticon.com/512/1049/1049314.png" alt="Цветок">
            </div>
        </div>

        <!-- Экран победы -->
        <div id="win-screen">
            <h2>🎉 Зелье готово!</h2>
            <button class="btn" onclick="resetGame()">Играть снова</button>
        </div>
    </div>

    <script>
        let score = 0;
        const totalItems = 4;

        function drag(event) {
            event.dataTransfer.setData("text", event.target.id);
        }

        function allowDrop(event) {
            event.preventDefault();
            event.currentTarget.classList.add('drag-over');
        }

        function removeHighlight(event) {
            event.currentTarget.classList.remove('drag-over');
        }

        function dropItem(event) {
            event.preventDefault();
            const zone = event.currentTarget;
            zone.classList.remove('drag-over');

            const itemId = event.dataTransfer.getData("text");
            const item = document.getElementById(itemId);
            
            if (!item) return;

            // Проверка соответствия категории
            const itemCat = item.getAttribute('data-category');
            const zoneCat = zone.getAttribute('data-category');

            if (itemCat === zoneCat) {
                zone.appendChild(item);
                item.setAttribute('draggable', 'false');
                item.style.cursor = 'default';
                item.style.transform = 'none';
                score++;
                document.getElementById('score').innerText = score;

                if (score === totalItems) {
                    setTimeout(() => {
                        document.getElementById('win-screen').style.display = 'flex';
                    }, 400);
                }
            } else {
                // Анимация ошибки (легкое покачивание)
                item.style.transform = 'translateX(8px)';
                setTimeout(() => item.style.transform = 'none', 150);
            }
        }

        function resetGame() {
            score = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('win-screen').style.display = 'none';
            
            const pool = document.getElementById('pool');
            const items = document.querySelectorAll('.draggable-item');
            
            items.forEach(item => {
                item.setAttribute('draggable', 'true');
                item.style.cursor = 'grab';
                pool.appendChild(item);
            });
        }
    </script>
</body>
</html>
